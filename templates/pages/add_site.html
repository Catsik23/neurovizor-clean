{% extends "base.html" %}
{% block title %}Добавить сайт — Нейровизор{% endblock %}
{% block content %}
<style>
    .add-container { max-width: 560px; margin: 40px auto; padding: 0 20px; }
    .add-card { padding: 32px; }
    .add-card h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
    .tariff-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .tariff-opt { padding: 14px 10px; text-align: center; cursor: pointer; transition: var(--transition-fast); }
    .tariff-opt input { display: none; }
    .tariff-opt.selected { border-color: var(--border-neon); box-shadow: var(--shadow-neon); }
    .tariff-opt-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .tariff-opt-name { font-weight: 700; font-size: 0.8rem; }
    .tariff-opt-price { font-family: var(--font-mono); font-size: 0.72rem; color: var(--neon-cyan); margin-top: 2px; }
</style>

<div class="add-container">
    <div class="card add-card">
        <h1 class="gradient-text">Добавить сайт</h1>
        <p class="text-muted text-sm mb-3">Введите URL — мы проанализируем и создадим нейро-карточку</p>

        <form method="POST" onsubmit="var b=this.querySelector('button[type=submit]');b.disabled=true;b.textContent='Анализ...';">
            <div class="form-group">
                <label class="form-label" for="url">URL сайта</label>
                <input type="text" name="url" id="url" class="form-input" placeholder="https://example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Тариф</label>
                <div class="tariff-select" id="tariffSelect">
                    <label class="card tariff-opt {% if request.args.get('tariff', 'trial') == 'trial' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="trial" {% if request.args.get('tariff', 'trial') == 'trial' %}checked{% endif %}>
                        <div class="tariff-opt-icon">💎</div>
                        <div class="tariff-opt-name">Пробный</div>
                        <div class="tariff-opt-price">7 дней</div>
                    </label>
                    <label class="card tariff-opt {% if request.args.get('tariff') == 'lite' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="lite" {% if request.args.get('tariff') == 'lite' %}checked{% endif %}>
                        <div class="tariff-opt-icon">⚡</div>
                        <div class="tariff-opt-name">Lite</div>
                        <div class="tariff-opt-price">399₽/мес</div>
                    </label>
                    <label class="card tariff-opt {% if request.args.get('tariff') == 'basic' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="basic" {% if request.args.get('tariff') == 'basic' %}checked{% endif %}>
                        <div class="tariff-opt-icon">🔮</div>
                        <div class="tariff-opt-name">Базовый</div>
                        <div class="tariff-opt-price">599₽/мес</div>
                    </label>
                    <label class="card tariff-opt {% if request.args.get('tariff') == 'pro2' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="pro2" {% if request.args.get('tariff') == 'pro2' %}checked{% endif %}>
                        <div class="tariff-opt-icon">🤖</div>
                        <div class="tariff-opt-name">2.0</div>
                        <div class="tariff-opt-price">799₽/мес</div>
                    </label>
                    <label class="card tariff-opt {% if request.args.get('tariff') == 'pro' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="pro" {% if request.args.get('tariff') == 'pro' %}checked{% endif %}>
                        <div class="tariff-opt-icon">👑</div>
                        <div class="tariff-opt-name">PRO</div>
                        <div class="tariff-opt-price">999₽/мес</div>
                    </label>
                    <label class="card tariff-opt {% if request.args.get('tariff') == 'business' %}selected{% endif %}">
                        <input type="radio" name="tariff" value="business" {% if request.args.get('tariff') == 'business' %}checked{% endif %}>
                        <div class="tariff-opt-icon">🚀</div>
                        <div class="tariff-opt-name">BUSINESS</div>
                        <div class="tariff-opt-price">1 599₽/мес</div>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-gold btn-lg w-full">Анализировать и создать</button>
        </form>
    </div>
</div>

<script>
document.querySelectorAll('#tariffSelect input[type=radio]').forEach(function(r) {
    r.addEventListener('change', function() {
        document.querySelectorAll('#tariffSelect .tariff-opt').forEach(function(o) { o.classList.remove('selected'); });
        this.closest('.tariff-opt').classList.add('selected');
    });
});
</script>
{% endblock %}
