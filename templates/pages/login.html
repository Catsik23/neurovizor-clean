{% extends "base.html" %}
{% block title %}Вход — Нейровизор{% endblock %}
{% block content %}
<style>
    .login-container { max-width: 440px; margin: 60px auto; padding: 0 20px; }
    .login-card { padding: 36px 28px; }
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; }
    .register-link { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); }
    .register-link a { color: var(--neon-purple); text-decoration: none; font-weight: 600; }
</style>
<div class="login-container">
    <div class="card login-card">
        <div class="login-header">
            <h1 class="gradient-text">Вход</h1>
            <p class="text-muted text-sm">С возвращением</p>
        </div>
        <form method="POST" id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email</label>
                <input type="email" name="email" id="loginEmail" class="form-input" placeholder="email@domain.ru" required autocomplete="email">
                <div class="form-error" id="loginEmailErr"></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPass">Пароль</label>
                <input type="password" name="password" id="loginPass" class="form-input" placeholder="Ваш пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-gold btn-lg w-full mt-2" id="loginBtn">Войти</button>
        </form>
        <div class="register-link">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</div>
<script>
(function() {
    var form = document.getElementById('loginForm');
    var btn = document.getElementById('loginBtn');
    var email = document.getElementById('loginEmail');
    var emailErr = document.getElementById('loginEmailErr');

    email.addEventListener('input', function() {
        var v = email.value;
        if (!v) { emailErr.textContent = ''; emailErr.classList.remove('visible'); email.classList.remove('error','success'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
            emailErr.textContent = 'Некорректный email';
            emailErr.classList.add('visible');
            email.classList.add('error');
            email.classList.remove('success');
        } else {
            emailErr.textContent = '';
            emailErr.classList.remove('visible');
            email.classList.remove('error');
            email.classList.add('success');
        }
    });

    form.addEventListener('submit', function() {
        if (btn.disabled) return false;
        btn.disabled = true;
        btn.textContent = 'Вход...';
    });
})();
</script>
{% endblock %}
